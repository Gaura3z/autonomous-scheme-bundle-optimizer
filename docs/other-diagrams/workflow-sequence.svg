<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="800" height="400" fill="#ffffff" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  
  <text x="30" y="40" fill="#0f172a" font-family="system-ui, sans-serif" font-size="16" font-weight="800">
    Citizen Discovery & Optimization Workflow (PS16)
  </text>
  <text x="30" y="60" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">
    From Profile Input to Conflict-Free Application Bundle
  </text>

  <!-- Step 1 -->
  <circle cx="90" cy="160" r="30" fill="#047857" />
  <text x="90" y="166" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1</text>
  <text x="90" y="215" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Demographic Input</text>
  <text x="90" y="232" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">State, Land, Income</text>

  <!-- Line 1 to 2 -->
  <line x1="125" y1="160" x2="215" y2="160" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="4" />

  <!-- Step 2 -->
  <circle cx="250" cy="160" r="30" fill="#1e3a8a" />
  <text x="250" y="166" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2</text>
  <text x="250" y="215" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Deterministic Matching</text>
  <text x="250" y="232" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">4,770+ Gazette Rules</text>

  <!-- Line 2 to 3 -->
  <line x1="285" y1="160" x2="375" y2="160" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="4" />

  <!-- Step 3 -->
  <circle cx="410" cy="160" r="30" fill="#dc2626" />
  <text x="410" y="166" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3</text>
  <text x="410" y="215" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Conflict Pruning</text>
  <text x="410" y="232" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Exclusion Matrix</text>

  <!-- Line 3 to 4 -->
  <line x1="445" y1="160" x2="535" y2="160" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="4" />

  <!-- Step 4 -->
  <circle cx="570" cy="160" r="30" fill="#ea580c" />
  <text x="570" y="166" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">4</text>
  <text x="570" y="215" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Bundle Utility Solve</text>
  <text x="570" y="232" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Max DBT & Grants</text>

  <!-- Line 4 to 5 -->
  <line x1="605" y1="160" x2="695" y2="160" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="4" />

  <!-- Step 5 -->
  <circle cx="730" cy="160" r="30" fill="#047857" />
  <text x="730" y="166" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">5</text>
  <text x="730" y="215" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Sequenced Roadmap</text>
  <text x="730" y="232" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Document Inventory</text>

  <!-- Bottom Guarantee Callout -->
  <rect x="50" y="290" width="700" height="70" rx="10" fill="#ecfdf5" stroke="#a7f3d0" />
  <text x="70" y="322" fill="#065f46" font-family="system-ui, sans-serif" font-size="13" font-weight="700">
    🔒 Privacy Guarantee: Zero PII or Identity Uploads
  </text>
  <text x="70" y="342" fill="#047857" font-family="system-ui, sans-serif" font-size="11">
    Evaluated completely within client state with zero risk of identity theft or data exfiltration.
  </text>
</svg>
