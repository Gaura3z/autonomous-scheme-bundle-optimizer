<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#f8fafc" rx="16" />

  <!-- Header Banner -->
  <rect x="30" y="24" width="840" height="60" rx="12" fill="url(#blueGrad)" filter="url(#dropShadow)" />
  <text x="50" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">
    myScheme PS16: Autonomous Bundle Optimizer Architecture
  </text>
  <text x="680" y="60" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">
    Kurukshetra 2.0 Hackfest
  </text>

  <!-- Layer 1: Client UI Layer -->
  <g filter="url(#dropShadow)">
    <rect x="40" y="110" width="240" height="350" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <rect x="40" y="110" width="240" height="36" rx="12" fill="#f1f5f9" />
    <text x="55" y="134" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1. Citizen Interface Layer</text>
    
    <rect x="55" y="160" width="210" height="50" rx="8" fill="#ecfdf5" stroke="#a7f3d0" />
    <text x="70" y="185" fill="#047857" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Authentic myScheme Portal</text>
    <text x="70" y="200" fill="#065f46" font-family="system-ui, sans-serif" font-size="10">Hero, Stats, Category Grid</text>

    <rect x="55" y="225" width="210" height="50" rx="8" fill="#eff6ff" stroke="#bfdbfe" />
    <text x="70" y="250" fill="#1e40af" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Zero-Upload Profile Wizard</text>
    <text x="70" y="265" fill="#1e3a8a" font-family="system-ui, sans-serif" font-size="10">Demographics, State, Livelihood</text>

    <rect x="55" y="290" width="210" height="50" rx="8" fill="#fffbeb" stroke="#fde68a" />
    <text x="70" y="315" fill="#92400e" font-family="system-ui, sans-serif" font-size="12" font-weight="700">SchemeBot AI Mascot</text>
    <text x="70" y="330" fill="#78350f" font-family="system-ui, sans-serif" font-size="10">Natural Language Inquiry</text>

    <rect x="55" y="355" width="210" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="70" y="380" fill="#334155" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Interactive Phone Preview</text>
    <text x="70" y="395" fill="#475569" font-family="system-ui, sans-serif" font-size="10">Simulated UMANG App Mode</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 280 280 L 325 280" stroke="#047857" stroke-width="3" fill="none" marker-end="url(#arrow)" />

  <!-- Layer 2: Decision Engine -->
  <g filter="url(#dropShadow)">
    <rect x="330" y="110" width="250" height="350" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <rect x="330" y="110" width="250" height="36" rx="12" fill="#f1f5f9" />
    <text x="345" y="134" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2. Autonomous Rule Engine</text>

    <rect x="345" y="160" width="220" height="55" rx="8" fill="#ecfdf5" stroke="#a7f3d0" />
    <text x="360" y="185" fill="#065f46" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Gazette Filter (4,770+)</text>
    <text x="360" y="200" fill="#047857" font-family="system-ui, sans-serif" font-size="10">Age, Land, Income, Domicile</text>

    <rect x="345" y="230" width="220" height="55" rx="8" fill="#fef2f2" stroke="#fecaca" />
    <text x="360" y="255" fill="#991b1b" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Conflict Matrix Pruner</text>
    <text x="360" y="270" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="10">Eliminates Statutory Clawbacks</text>

    <rect x="345" y="300" width="220" height="55" rx="8" fill="#fff7ed" stroke="#fed7aa" />
    <text x="360" y="325" fill="#c2410c" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Bundle Utility Maximizer</text>
    <text x="360" y="340" fill="#ea580c" font-family="system-ui, sans-serif" font-size="10">Highest DBT & Capital Leverage</text>

    <rect x="345" y="370" width="220" height="55" rx="8" fill="#f1f5f9" stroke="#cbd5e1" />
    <text x="360" y="395" fill="#1e293b" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Minimal Document Synthesizer</text>
    <text x="360" y="410" fill="#475569" font-family="system-ui, sans-serif" font-size="10">Cross-Scheme Common Prereqs</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 580 280 L 625 280" stroke="#047857" stroke-width="3" fill="none" />

  <!-- Layer 3: Output & Citizen Roadmap -->
  <g filter="url(#dropShadow)">
    <rect x="630" y="110" width="240" height="350" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <rect x="630" y="110" width="240" height="36" rx="12" fill="#f1f5f9" />
    <text x="645" y="134" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">3. Actionable Outputs</text>

    <rect x="645" y="160" width="210" height="60" rx="8" fill="#ecfdf5" stroke="#a7f3d0" />
    <text x="660" y="185" fill="#047857" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Optimized Bundle</text>
    <text x="660" y="202" fill="#065f46" font-family="system-ui, sans-serif" font-size="10">Annual Benefit: ₹84,000+</text>

    <rect x="645" y="235" width="210" height="60" rx="8" fill="#eff6ff" stroke="#bfdbfe" />
    <text x="660" y="260" fill="#1e40af" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Sequenced Application Plan</text>
    <text x="660" y="277" fill="#1e3a8a" font-family="system-ui, sans-serif" font-size="10">Phase 1 -> Phase 2 Milestones</text>

    <rect x="645" y="310" width="210" height="60" rx="8" fill="#fffbeb" stroke="#fde68a" />
    <text x="660" y="335" fill="#92400e" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Document Checklist</text>
    <text x="660" y="352" fill="#78350f" font-family="system-ui, sans-serif" font-size="10">Direct links to official portals</text>
  </g>
</svg>
